name: Tests
# The whole suite: the engine, the clinical and saturable models, the cases, the service worker, and the
# comparison with the independent reference results in validation/. Node 20, no dependencies.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/
