<script>
  // On a custom domain the site lives at the root rather than under /dose-curve/.
  if(!/^\/dose-curve(\/|$)/.test(location.pathname)){
    document.querySelectorAll('[href^="/dose-curve/"],[src^="/dose-curve/"]').forEach(el=>{
      const a=el.hasAttribute("href") ? "href" : "src";
      el.setAttribute(a, el.getAttribute(a).replace(/^\/dose-curve\//,"/"));
    });
  }
</script>
