<script>(function(){ var d=document.documentElement, t=null;
  // (3.0) the settings and work saved under the old name's keys move to MaatiRX's, once, on whichever page loads first.
  // A key saved under both (an older tab kept writing) is set aside for ui-move.js to merge; an old key goes only once
  // its value is kept.
  try{ var ls=localStorage, old=[]; for(var x=0;x<ls.length;x++) if(/^dosecurve[.-]/.test(ls.key(x))) old.push(ls.key(x));
    old.forEach(function(k){ try{ var m="maatirx"+k.slice(9), v=ls.getItem(k), h=ls.getItem(m);
      if(h==null) ls.setItem(m, v); else if(h!==v) ls.setItem("maatirx-premove:"+m, v); ls.removeItem(k); }catch(e){} }); }catch(e){}
  try{ t=localStorage.getItem("maatirx.theme"); }catch(e){}
  if(!t && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) t="light";
  if(t==="light") d.classList.add("light"); })();</script>

</main>
<script>
  // On the github.io project site the pages live in the project's folder, the path's first segment.
  if(/\.github\.io$/.test(location.hostname)){
    const base="/"+location.pathname.split("/")[1];
    document.querySelectorAll('[href^="/"],[src^="/"]').forEach(el=>{
      const a=el.hasAttribute("href") ? "href" : "src";
      el.setAttribute(a, base+el.getAttribute(a));
    });
    // and the fonts, which the stylesheet names
    const st=document.querySelector("style");
    if(st) st.textContent=st.textContent.replace(/url\(\//g,"url("+base+"/");
  }
</script>
